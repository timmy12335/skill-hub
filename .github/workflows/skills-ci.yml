name: skills-ci
on:
  pull_request:
    paths: ["skills/**", "plugins/**", "tools/**", "templates/**", "security/**", "teams/**", "telemetry/**", "skillhub.json"]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lint all skills
        run: python3 tools/skillctl.py lint
      - name: Check eval cases (format only)
        run: |
          for d in skills/*/*/; do
            n=$(basename "$d")
            [ -f "$d/evals/cases.jsonl" ] && python3 tools/skillctl.py eval "$n" --dry-run
          done
      - name: Require version bump when a skill changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" -- skills | cut -d/ -f2-3 | sort -u)
          fail=0
          for s in $changed; do
            [ -f "skills/$s/SKILL.md" ] || continue
            if git cat-file -e "origin/${{ github.base_ref }}:skills/$s/SKILL.md" 2>/dev/null; then
              old=$(git show "origin/${{ github.base_ref }}:skills/$s/SKILL.md" | grep -m1 'version:' || true)
              new=$(grep -m1 'version:' "skills/$s/SKILL.md")
              if [ "$old" = "$new" ]; then echo "::error::skills/$s 有修改但 metadata.version 沒有更新"; fail=1; fi
            fi
          done
          exit $fail

  # 選用：在 repo secrets 設 ANTHROPIC_API_KEY 後，對有變更的 core / always-on skill 跑真正的 eval
  eval:
    if: github.event_name == 'pull_request' && vars.SKILL_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Eval changed core/always-on skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for s in $(git diff --name-only "origin/${{ github.base_ref }}" -- skills/core skills/always-on | cut -d/ -f3 | sort -u); do
            python3 tools/skillctl.py eval "$s"
          done

  # 找出這個 PR 改到哪些 skill（給安全掃描用）
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.c.outputs.skills }}
      adopt_path: ${{ steps.c.outputs.adopt_path }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: c
        run: |
          dirs=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- skills \
                 | cut -d/ -f1-3 | sort -u | while read d; do [ -f "$d/SKILL.md" ] && echo "$d"; done)
          echo "skills=$(echo $dirs)" >> "$GITHUB_OUTPUT"
          # adopt/<name> PR 只會有一個 skills/domain/<name>
          echo "adopt_path=$(echo "$dirs" | grep '^skills/domain/' | head -1)" >> "$GITHUB_OUTPUT"

  # 第一層（每個改到 skill 的 PR 都跑，會擋）：skillctl scan，後端看 skillhub.json security.scanner
  # 預設 NVIDIA SkillSpector 靜態分析，不送 LLM、不用 API key。
  # 超過門檻就失敗；確認是誤判 → 本機 skillctl scan --accept 寫進 security/scan-results.json，跟 PR 一起送審。
  security:
    needs: changes
    if: needs.changes.outputs.skills != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install scanner
        run: |
          scanner=$(python3 -c "import json;print(json.load(open('skillhub.json')).get('security',{}).get('scanner','skillspector'))")
          echo "SCANNER=$scanner" >> "$GITHUB_ENV"
          if [ "$scanner" = cisco ]; then uv tool install cisco-ai-skill-scanner
          else uv tool install --python 3.13 git+https://github.com/NVIDIA/skillspector.git; fi
      - name: Scan changed skills (static)
        run: |
          names=""; for d in ${{ needs.changes.outputs.skills }}; do names="$names $(basename "$d")"; done
          python3 tools/skillctl.py scan $names
      - name: SARIF report
        if: always()
        run: |
          mkdir -p sarif
          for d in ${{ needs.changes.outputs.skills }}; do
            n=$(basename "$d")
            if [ "$SCANNER" = cisco ]; then skill-scanner scan "$d" --policy low-noise --lenient --format sarif --output-sarif "sarif/$n.sarif" || true
            else skillspector scan "$d" --no-llm --format sarif --output "sarif/$n.sarif" || true; fi
          done
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true   # 私有 repo 沒開 code scanning 時不擋
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: sarif, category: skill-scan }

  # 第二層（只在 adopt/ 自動合併的 domain PR 跑）：Cisco skill-scanner + LLM judge
  # 靜態規則只抓到約 8% 的惡意 skill，自動合併沒有人看，所以多一層語意判斷。
  # 預設關閉：設 repo variable SKILL_SCANNER_LLM=true，並加 secret SKILL_SCANNER_LLM_API_KEY（LLM 供應商的 key）。
  # 沒開時這層略過，自動合併照樣只看第一層。
  llm-judge:
    needs: changes
    if: >-
      startsWith(github.head_ref, 'adopt/') &&
      vars.SKILL_SCANNER_LLM == 'true' &&
      needs.changes.outputs.adopt_path != ''
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@2.3.2
    with:
      scanner_version: "2.3.2"
      skill_path: ${{ needs.changes.outputs.adopt_path }}
      scan_mode: scan
      policy: low-noise
      fail_on_severity: high
      use_llm: true
      llm_model: ${{ vars.SKILL_SCANNER_LLM_MODEL || 'anthropic/claude-sonnet-5-5' }}
      upload_sarif: false
    secrets:
      llm_api_key: ${{ secrets.SKILL_SCANNER_LLM_API_KEY }}
    permissions:
      security-events: write
      contents: read
      actions: read

  # skillctl adopt 開的 adopt/<name> PR：只動到 skills/domain/ 且 lint、安全掃描都通過就自動合併
  # （core / always-on / tools 的改動不會走這條，一定要人審；
  #   在 security/scan-results.json 接受風險也算「超出 skills/domain/」，一樣要人審）
  auto-merge-adopted:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'adopt/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.lint.result == 'success' &&
      needs.security.result == 'success' &&
      (needs.llm-judge.result == 'success' || needs.llm-judge.result == 'skipped')
    needs: [lint, security, llm-judge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check the PR only touches skills/domain/
        id: scope
        run: |
          other=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -v '^skills/domain/' || true)
          if [ -n "$other" ]; then
            echo "改動超出 skills/domain/，需要人工審查："; echo "$other"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --repo "${{ github.repository }}"

  # skillctl report --pr 開的 telemetry/<代號> PR：只改 telemetry/*.json 就自動合併（看板隨後更新）
  auto-merge-telemetry:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'telemetry/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check the PR only touches telemetry/*.json and it is valid JSON
        id: scope
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          other=$(echo "$files" | grep -v '^telemetry/[a-z0-9]*\.json$' || true)
          if [ -n "$other" ]; then echo "改動超出 telemetry/，需要人工審查："; echo "$other"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          for f in $files; do python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('schema')==1" "$f"; done
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Merge
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --repo "${{ github.repository }}"
