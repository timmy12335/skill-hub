name: skills-ci
on:
  pull_request:
    paths: ["skills/**", "plugins/**", "tools/**", "templates/**"]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lint all skills
        run: python3 tools/skillctl.py lint
      - name: Check eval cases (format only)
        run: |
          for d in skills/*/*/; do
            n=$(basename "$d")
            [ -f "$d/evals/cases.jsonl" ] && python3 tools/skillctl.py eval "$n" --dry-run
          done
      - name: Require version bump when a skill changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" -- skills | cut -d/ -f2-3 | sort -u)
          fail=0
          for s in $changed; do
            [ -f "skills/$s/SKILL.md" ] || continue
            if git cat-file -e "origin/${{ github.base_ref }}:skills/$s/SKILL.md" 2>/dev/null; then
              old=$(git show "origin/${{ github.base_ref }}:skills/$s/SKILL.md" | grep -m1 'version:' || true)
              new=$(grep -m1 'version:' "skills/$s/SKILL.md")
              if [ "$old" = "$new" ]; then echo "::error::skills/$s 有修改但 metadata.version 沒有更新"; fail=1; fi
            fi
          done
          exit $fail

  # 選用：在 repo secrets 設 ANTHROPIC_API_KEY 後，對有變更的 core / always-on skill 跑真正的 eval
  eval:
    if: github.event_name == 'pull_request' && vars.SKILL_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Eval changed core/always-on skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for s in $(git diff --name-only "origin/${{ github.base_ref }}" -- skills/core skills/always-on | cut -d/ -f3 | sort -u); do
            python3 tools/skillctl.py eval "$s"
          done

  # skillctl adopt 開的 adopt/<name> PR：只動到 skills/domain/ 且 lint 通過就自動合併
  # （core / always-on / tools 的改動不會走這條，一定要人審）
  auto-merge-adopted:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'adopt/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check the PR only touches skills/domain/
        id: scope
        run: |
          other=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -v '^skills/domain/' || true)
          if [ -n "$other" ]; then
            echo "改動超出 skills/domain/，需要人工審查："; echo "$other"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --repo "${{ github.repository }}"
